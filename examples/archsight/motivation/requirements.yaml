apiVersion: architecture/v1alpha1
kind: MotivationRequirement
metadata:
  name: Requirement:OpenSource
  annotations:
    architecture/description: |
      The software must be released under an OSI-approved open source license
      to enable community contribution and transparency.
    requirement/type: legal
    requirement/priority: must
    architecture/tags: licensing,opensource
spec:
  realizes:
    outcomes:
      - Outcome:CommunityAdoption
---
apiVersion: architecture/v1alpha1
kind: MotivationRequirement
metadata:
  name: Requirement:RubyCompatibility
  annotations:
    architecture/description: |
      The software must support Ruby 3.4 and later versions to ensure
      compatibility with modern Ruby features and security updates.
    requirement/type: functional
    requirement/priority: must
    architecture/tags: ruby,compatibility
spec:
  realizes:
    outcomes:
      - Outcome:DeveloperProductivity
---
apiVersion: architecture/v1alpha1
kind: MotivationRequirement
metadata:
  name: Requirement:QueryLanguage
  annotations:
    architecture/description: |
      The software must provide a powerful query language that supports:
      - Annotation filtering with comparison operators
      - Relation traversal (direct and transitive)
      - Boolean logic (AND, OR, NOT)
      - Kind filtering
      - Subqueries
    requirement/type: functional
    requirement/priority: must
    architecture/tags: query,filtering
spec:
  realizes:
    outcomes:
      - Outcome:ArchitectureVisibility
---
apiVersion: architecture/v1alpha1
kind: MotivationRequirement
metadata:
  name: Requirement:Checkout:Availability
  annotations:
    architecture/description: |
      The payment authorization is available 99.9% of the month. Binding
      through the SLA of the checkout contract.
    requirement/type: non-functional
    requirement/priority: must
    architecture/tags: example,payments
spec: {}
---
apiVersion: architecture/v1alpha1
kind: MotivationRequirement
metadata:
  name: Requirement:Backup:Catalogue
  annotations:
    architecture/description: |
      A catalogue requirement (in the style of an IT-Grundschutz building
      block): data is backed up regularly. It is not realized directly, it is
      made concrete by the requirements it is refined by.
    requirement/type: compliance
    requirement/reference: itgs-2023
    requirement/priority: must
    architecture/tags: example,backup
spec:
  refinedBy:
    motivationRequirements:
      - Requirement:Backup:Daily
---
apiVersion: architecture/v1alpha1
kind: MotivationRequirement
metadata:
  name: Requirement:Backup:Daily
  annotations:
    architecture/description: |
      The derived requirement: every database is backed up daily and a restore
      is tested quarterly.
    requirement/type: functional
    requirement/priority: must
    architecture/tags: example,backup
spec: {}
