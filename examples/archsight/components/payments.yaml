apiVersion: architecture/v1alpha1
kind: ApplicationComponent
metadata:
  name: Payments:API
  annotations:
    architecture/description: |
      The API of the payments backend, named by its runtime role. It is
      built from one repository and belongs to exactly one service.
    architecture/tags: example,payments
    component/type: executable
    component/role: service
spec:
  dependsOn:
    applicationInterfaces:
      - CardVault:Lookup
  realizedThrough:
    technologyArtifacts:
      - Repo:payments-api
  servedBy:
    technologyServices:
      - Payments:Cluster
  maintainedBy:
    businessActors:
      - Archsight:Maintainers
  operatedBy:
    businessActors:
      - Team:Infrastructure
---
apiVersion: architecture/v1alpha1
kind: ApplicationComponent
metadata:
  name: Refunds:Worker
  annotations:
    architecture/description: |
      Background worker that executes refunds, named by its runtime role.
    architecture/tags: example,payments
    component/type: executable
    component/role: job
spec:
  realizedThrough:
    technologyArtifacts:
      - Repo:refunds-worker
  servedBy:
    technologyServices:
      - Payments:Cluster
---
apiVersion: architecture/v1alpha1
kind: ApplicationComponent
metadata:
  name: CardVault:API
  annotations:
    architecture/description: |
      Stores the card behind a token and answers lookups of it. It exposes an internal API to the payments
      components, which is also the example for the reachability of an interface (`servedBy` networks).
    architecture/tags: example,payments
    component/type: executable
    component/role: service
spec:
  exposes:
    applicationInterfaces:
      - CardVault:Lookup
---
apiVersion: architecture/v1alpha1
kind: ApplicationComponent
metadata:
  name: Payments:ClusterOperator
  annotations:
    architecture/description: |
      The operator that creates the payments cluster and keeps it in its desired state (`provisions`). It runs on
      the compute platform (`servedBy`), not in the cluster it builds: the cluster keeps running while the operator is
      down and only changes stop.
    architecture/tags: example,payments
    component/type: executable
    component/role: operator
spec:
  provisions:
    technologyServices:
      - Payments:Cluster
  servedBy:
    technologyServices:
      - Tech:Compute
