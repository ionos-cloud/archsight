apiVersion: architecture/v1alpha1
kind: ApplicationComponent
metadata:
  name: Payments:API
  annotations:
    architecture/description: |
      The API of the payments backend, named by its runtime role. It is
      built from one repository and belongs to exactly one service.
    architecture/tags: example,payments
    component/type: executable
    component/role: service
spec:
  realizedThrough:
    technologyArtifacts:
      - Repo:payments-api
  servedBy:
    technologyServices:
      - Payments:Cluster
---
apiVersion: architecture/v1alpha1
kind: ApplicationComponent
metadata:
  name: Refunds:Worker
  annotations:
    architecture/description: |
      Background worker that executes refunds, named by its runtime role.
    architecture/tags: example,payments
    component/type: executable
    component/role: job
spec:
  realizedThrough:
    technologyArtifacts:
      - Repo:refunds-worker
  servedBy:
    technologyServices:
      - Payments:Cluster
