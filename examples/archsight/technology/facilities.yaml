apiVersion: architecture/v1alpha1
kind: Location
metadata:
  name: Location:Germany:Frankfurt
  annotations:
    architecture/description: |
      Metro area of the example data centers.
    location/country: Germany
    location/city: Frankfurt
spec: {}
---
apiVersion: architecture/v1alpha1
kind: Location
metadata:
  name: Location:Spain:Madrid
  annotations:
    architecture/description: |
      Second metro area of the example data centers.
    location/country: Spain
    location/city: Madrid
spec: {}
---
apiVersion: architecture/v1alpha1
kind: TechnologyFacility
metadata:
  name: Facility:Frankfurt:Campus
  annotations:
    architecture/description: |
      Campus with two data center halls. A campus is a facility that is `composedOf` the halls.
    facility/type: data-center
    facility/stage: productive
spec:
  locatedAt:
    locations:
      - Location:Germany:Frankfurt
  composedOf:
    technologyFacilities:
      - Facility:Frankfurt:HallA
      - Facility:Frankfurt:HallB
  servedBy:
    businessActors:
      - Archsight:Maintainers
---
apiVersion: architecture/v1alpha1
kind: TechnologyFacility
metadata:
  name: Facility:Frankfurt:HallA
  annotations:
    architecture/description: Data center hall A of the Frankfurt campus, split into two rooms (fire compartments).
    facility/type: data-center
    facility/stage: productive
spec:
  composedOf:
    technologyFacilities:
      - Facility:Frankfurt:HallA:Room1
      - Facility:Frankfurt:HallA:Room2
---
apiVersion: architecture/v1alpha1
kind: TechnologyFacility
metadata:
  name: Facility:Frankfurt:HallA:Room1
  annotations:
    architecture/description: Server room 1 of hall A, a fire compartment of its own. The devices standing here are lost together.
    facility/type: room
spec: {}
---
apiVersion: architecture/v1alpha1
kind: TechnologyFacility
metadata:
  name: Facility:Frankfurt:HallA:Room2
  annotations:
    architecture/description: Server room 2 of hall A, the second fire compartment.
    facility/type: room
spec: {}
---
apiVersion: architecture/v1alpha1
kind: TechnologyFacility
metadata:
  name: Facility:Frankfurt:HallB
  annotations:
    architecture/description: Data center hall B of the Frankfurt campus.
    facility/type: data-center
    facility/stage: in build
spec: {}
---
apiVersion: architecture/v1alpha1
kind: TechnologyFacility
metadata:
  name: Facility:Madrid:DC
  annotations:
    architecture/description: Colocation data center in Madrid.
    facility/type: colocation
    facility/stage: productive
spec:
  locatedAt:
    locations:
      - Location:Spain:Madrid
---
apiVersion: architecture/v1alpha1
kind: TechnologyEquipment
metadata:
  name: Equipment:Frankfurt:HallA:Rack01
  annotations:
    architecture/description: Rack 01 in hall A, holding the web servers and the first hypervisors.
    equipment/type: rack
spec:
  locatedAt:
    technologyFacilities:
      - Facility:Frankfurt:HallA
  composedOf:
    technologyDevices:
      - Device:Frankfurt:Server01
      - Device:Frankfurt:Server02
---
apiVersion: architecture/v1alpha1
kind: TechnologyNode
metadata:
  name: Node:Frankfurt:Web01
  annotations:
    architecture/description: Example web server of the archsight demo deployment.
    infrastructure/type: bare-metal
spec:
  locatedAt:
    technologyFacilities:
      - Facility:Frankfurt:HallA
  servedBy:
    technologyCommunicationNetworks:
      - Network:Management:Frankfurt
---
apiVersion: architecture/v1alpha1
kind: TechnologySystemSoftware
metadata:
  name: Tech:Puma:Cluster
  annotations:
    architecture/description: |
      The Puma web server cluster of the demo deployment. It is one element that runs in
      three places: two halls and a second site.
spec:
  locatedAt:
    technologyFacilities:
      - Facility:Frankfurt:HallA
      - Facility:Frankfurt:HallB
      - Facility:Madrid:DC
---
apiVersion: architecture/v1alpha1
kind: TechnologyEquipment
metadata:
  name: Equipment:Link:Frankfurt-Madrid
  annotations:
    architecture/description: |
      Fibre route between Frankfurt and Madrid. A link is one TechnologyEquipment that is `locatedAt` both end facilities.
    equipment/type: link
spec:
  locatedAt:
    technologyFacilities:
      - Facility:Frankfurt:Campus
      - Facility:Madrid:DC
---
apiVersion: architecture/v1alpha1
kind: TechnologyEquipment
metadata:
  name: Equipment:Link:HallA-HallB
  annotations:
    architecture/description: Link between the two halls of the Frankfurt campus.
    equipment/type: link
spec:
  locatedAt:
    technologyFacilities:
      - Facility:Frankfurt:HallA
      - Facility:Frankfurt:HallB
---
apiVersion: architecture/v1alpha1
kind: TechnologyEquipment
metadata:
  name: Equipment:Backbone
  annotations:
    architecture/description: The backbone, the physical links between the facilities as one composed TechnologyEquipment.
    equipment/type: network-fabric
spec:
  composedOf:
    technologyEquipment:
      - Equipment:Link:Frankfurt-Madrid
      - Equipment:Link:HallA-HallB
---
apiVersion: architecture/v1alpha1
kind: TechnologyService
metadata:
  name: Network:Backbone
  annotations:
    architecture/description: |
      The logical backbone network. It runs in the facilities it reaches and is `realizedBy` the physical backbone.
spec:
  locatedAt:
    technologyFacilities:
      - Facility:Frankfurt:Campus
      - Facility:Madrid:DC
  realizedBy:
    technologyEquipment:
      - Equipment:Backbone
