apiVersion: architecture/v1alpha1
kind: TechnologyCommunicationNetwork
metadata:
  name: Network:Public
  annotations:
    architecture/description: The public network, reaching every facility of the example.
    network/type: public
spec:
  locatedAt:
    technologyFacilities:
      - Facility:Frankfurt:Campus
      - Facility:Madrid:DC
---
apiVersion: architecture/v1alpha1
kind: TechnologyCommunicationNetwork
metadata:
  name: Network:Management
  annotations:
    architecture/description: |
      The management network, a concept that each site implements with its own network (`specializes`).
    network/type: management
spec: {}
---
apiVersion: architecture/v1alpha1
kind: TechnologyCommunicationNetwork
metadata:
  name: Network:Management:Frankfurt
  annotations:
    architecture/description: Management network of the Frankfurt campus, built by the core switch and connecting the servers and firewalls of hall A.
    network/type: management
spec:
  specializes:
    technologyCommunicationNetworks:
      - Network:Management
  locatedAt:
    technologyFacilities:
      - Facility:Frankfurt:Campus
  ownedBy:
    businessActors:
      - Team:Infrastructure
  realizedBy:
    technologyDevices:
      - Device:Frankfurt:Switch:Core
  connects:
    technologyDevices:
      - Device:Frankfurt:Server01
      - Device:Frankfurt:Server02
      - Device:Frankfurt:Server03
      - Device:Frankfurt:Server04
      - Device:Frankfurt:Storage01
      - Device:Frankfurt:Storage02
      - Device:Frankfurt:Firewall01
      - Device:Frankfurt:Firewall02
---
apiVersion: architecture/v1alpha1
kind: TechnologyCommunicationNetwork
metadata:
  name: Network:Underlay:Frankfurt-Madrid
  annotations:
    architecture/description: Routed underlay between Frankfurt and Madrid.
    network/type: underlay
    network/topology: point-to-point
spec:
  locatedAt:
    technologyFacilities:
      - Facility:Frankfurt:Campus
      - Facility:Madrid:DC
  realizedBy:
    technologyDevices:
      - Device:Frankfurt:Router01
      - Device:Frankfurt:Router02
---
apiVersion: architecture/v1alpha1
kind: TechnologyCommunicationNetwork
metadata:
  name: Network:Overlay:EVPN
  annotations:
    architecture/description: |
      The BGP-EVPN overlay that carries the private workloads. One network, not one per customer: it is served by
      the underlay and realized by the routing software.
    network/type: overlay
    network/topology: mesh
spec:
  servedBy:
    technologyCommunicationNetworks:
      - Network:Underlay:Frankfurt-Madrid
  locatedAt:
    technologyFacilities:
      - Facility:Frankfurt:Campus
      - Facility:Madrid:DC
  realizedBy:
    technologySystemSoftware:
      - Tech:Routing:EVPN
---
apiVersion: architecture/v1alpha1
kind: TechnologyCommunicationNetwork
metadata:
  name: Network:VPN:Office
  annotations:
    architecture/description: A VPN that tunnels through the public network.
    network/type: vpn
    network/topology: hub-and-spoke
spec:
  servedBy:
    technologyCommunicationNetworks:
      - Network:Public
  locatedAt:
    technologyFacilities:
      - Facility:Madrid:DC
---
apiVersion: architecture/v1alpha1
kind: TechnologyCommunicationNetwork
metadata:
  name: Network:Metro:Frankfurt
  annotations:
    architecture/description: Network that supports the Frankfurt metro region, composed of the networks of its sites.
    network/type: underlay
spec:
  locatedAt:
    locations:
      - Location:Germany:Frankfurt
  composedOf:
    technologyCommunicationNetworks:
      - Network:Management:Frankfurt
---
apiVersion: architecture/v1alpha1
kind: TechnologySystemSoftware
metadata:
  name: Tech:Routing:EVPN
  annotations:
    architecture/description: Routing software that implements the BGP-EVPN overlay.
spec: {}
---
apiVersion: architecture/v1alpha1
kind: TechnologyCommunicationNetwork
metadata:
  name: Network:Overlay:Tenant
  annotations:
    architecture/description: |
      The tenant network overlay. It is built by software: the network operator creates the VXLAN segments and the
      SDN agent on each host wires the virtual machines into them, so it is `realizedBy` those components.
    network/type: overlay
spec:
  servedBy:
    technologyCommunicationNetworks:
      - Network:Underlay:Frankfurt-Madrid
  realizedBy:
    applicationComponents:
      - Network:Operator
      - Network:SDNAgent
---
apiVersion: architecture/v1alpha1
kind: ApplicationComponent
metadata:
  name: Network:Operator
  annotations:
    architecture/description: Operator that creates the VXLAN segments of the tenant networks.
    component/type: executable
    component/role: operator
spec: {}
---
apiVersion: architecture/v1alpha1
kind: ApplicationComponent
metadata:
  name: Network:SDNAgent
  annotations:
    architecture/description: Agent on every host that wires the virtual machines into the tenant network segments.
    component/type: executable
    component/role: agent
spec: {}
