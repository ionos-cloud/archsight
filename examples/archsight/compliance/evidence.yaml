apiVersion: architecture/v1alpha1
kind: ComplianceEvidence
metadata:
  name: Archsight:TestCoverage
  annotations:
    architecture/description: |
      Comprehensive test suite with 350+ test cases covering
      query parsing, evaluation, resource loading, and edge cases.
    evidence/type: technical-control
    evidence/status: implemented
    evidence/mechanism: |
      - Minitest suite run in CI on every push (`bundle exec rake test`).
      - Tests cover query parsing, evaluation and resource loading.
    evidence/coverage: |
      The query language and the resource loader. The **web frontend** is not covered by automated tests.
    evidence/operatorView: |
      Not applicable: the tests run in CI, not against operator access paths.
    evidence/verification: |
      Test results are published by the CI workflow for each pull request.
    evidence/gaps: |
      No browser-level tests of the web UI.
    evidence/sources: |
      `test/` directory and `.github/workflows/ci.yml`.
    architecture/tags: testing,quality
spec:
  satisfies:
    motivationRequirements:
      - Requirement:QueryLanguage
---
apiVersion: architecture/v1alpha1
kind: ComplianceEvidence
metadata:
  name: Archsight:CodeQuality
  annotations:
    architecture/description: |
      Code quality ensured through RuboCop linting, Steep type checking,
      and consistent code style enforcement.
    evidence/type: technical-control
    evidence/status: implemented
    architecture/tags: linting,types,quality
spec:
  satisfies:
    motivationRequirements:
      - Requirement:RubyCompatibility
